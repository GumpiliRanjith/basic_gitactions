name: artiface

on: push

jobs:
    yaara:
        runs-on: ubuntu-latest
        steps:
            - name: create file
              run: |
                 echo "welcome" > file.txt
            - name: upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: my file
                path: file.txt
    content:
        needs: yaara
        runs-on: ubuntu-latest
        steps:
            - name: get build artifact
              uses: actions/download-artifact@v4
              with:
                name: my file
            - name: output contents
              run: ls
